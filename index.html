<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LUKAYA! - Control de Operaciones</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: Arial, sans-serif; }
    .table-container { overflow-x: auto; }
    table { border-collapse: collapse; min-width: 100%; font-size: 13px; }
    th { background: #1e3a5f; color: white; padding: 8px 10px; text-align: left; white-space: nowrap; position: sticky; top: 0; z-index: 10; }
    td { padding: 7px 10px; border-bottom: 1px solid #e5e7eb; white-space: nowrap; vertical-align: middle; }
    tr:hover td { background: #f0f7ff; }
    tr.liquidado td { background: #f0fdf4; }
    tr.baja td { background: #fef2f2; color: #9ca3af; }
    .badge { padding: 2px 8px; border-radius: 9999px; font-size: 11px; font-weight: 600; white-space: nowrap; }
    .badge-liquidado { background: #dcfce7; color: #166534; }
    .badge-solicitado { background: #dbeafe; color: #1e40af; }
    .badge-cargada { background: #ffedd5; color: #9a3412; }
    .badge-proceso { background: #fef9c3; color: #854d0e; }
    .badge-baja { background: #fee2e2; color: #991b1b; }
    .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 100; display: flex; align-items: flex-start; justify-content: center; padding: 20px; overflow-y: auto; }
    .modal-box { background: white; border-radius: 12px; width: 100%; max-width: 820px; padding: 0; box-shadow: 0 20px 60px rgba(0,0,0,0.3); margin: auto; }
    .modal-header { background: #1e3a5f; color: white; padding: 16px 24px; border-radius: 12px 12px 0 0; display: flex; justify-content: space-between; align-items: center; }
    .modal-body { padding: 24px; max-height: 80vh; overflow-y: auto; }
    .section-title { font-size: 12px; font-weight: 700; text-transform: uppercase; color: #1e3a5f; border-bottom: 2px solid #1e3a5f; padding-bottom: 4px; margin: 20px 0 12px; letter-spacing: 0.05em; }
    .form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; }
    .form-group label { display: block; font-size: 11px; font-weight: 600; color: #374151; margin-bottom: 4px; }
    .form-group input, .form-group select, .form-group textarea { width: 100%; border: 1px solid #d1d5db; border-radius: 6px; padding: 7px 10px; font-size: 13px; outline: none; transition: border-color 0.2s; }
    .form-group input:focus, .form-group select:focus, .form-group textarea:focus { border-color: #1e3a5f; box-shadow: 0 0 0 2px rgba(30,58,95,0.1); }
    .form-group input[readonly] { background: #f3f4f6; color: #1e3a5f; font-weight: 600; }
    .check-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 8px; }
    .check-item { display: flex; align-items: center; gap: 8px; padding: 8px 10px; background: #f9fafb; border-radius: 6px; border: 1px solid #e5e7eb; cursor: pointer; }
    .check-item input[type=checkbox] { width: 16px; height: 16px; accent-color: #1e3a5f; cursor: pointer; }
    .check-item label { font-size: 12px; font-weight: 500; color: #374151; cursor: pointer; }
    .check-item.checked { background: #eff6ff; border-color: #93c5fd; }
    .btn { padding: 8px 18px; border-radius: 7px; font-size: 13px; font-weight: 600; cursor: pointer; border: none; transition: all 0.15s; }
    .btn-primary { background: #1e3a5f; color: white; }
    .btn-primary:hover { background: #162d4a; }
    .btn-success { background: #16a34a; color: white; }
    .btn-success:hover { background: #15803d; }
    .btn-danger { background: #dc2626; color: white; }
    .btn-danger:hover { background: #b91c1c; }
    .btn-secondary { background: #e5e7eb; color: #374151; }
    .btn-secondary:hover { background: #d1d5db; }
    .btn-sm { padding: 4px 10px; font-size: 11px; }
    .stat-card { background: white; border-radius: 10px; padding: 16px; box-shadow: 0 1px 4px rgba(0,0,0,0.08); border-left: 4px solid; }
    .money { color: #166534; font-weight: 600; }
    .neg { color: #dc2626; }
    .topbar { background: #1e3a5f; color: white; padding: 14px 24px; display: flex; align-items: center; justify-content: space-between; }
    .logo { font-size: 22px; font-weight: 800; letter-spacing: 1px; }
    .logo span { color: #fbbf24; }
    .toolbar { padding: 16px 24px; background: white; border-bottom: 1px solid #e5e7eb; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
    .toolbar input, .toolbar select { padding: 7px 12px; border: 1px solid #d1d5db; border-radius: 7px; font-size: 13px; outline: none; }
    .toolbar input:focus, .toolbar select:focus { border-color: #1e3a5f; }
    .totals-bar { background: #1e3a5f; color: white; padding: 10px 24px; display: flex; gap: 24px; flex-wrap: wrap; font-size: 13px; }
    .totals-bar span { opacity: 0.7; }
    .totals-bar strong { color: #fbbf24; }
    .cb { display: inline-block; width: 14px; height: 14px; border-radius: 3px; border: 1px solid #d1d5db; vertical-align: middle; }
    .cb.yes { background: #16a34a; border-color: #16a34a; color: white; text-align: center; line-height: 14px; font-size: 10px; }
    .delete-confirm { position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 200; display: flex; align-items: center; justify-content: center; }
    .delete-box { background: white; border-radius: 12px; padding: 28px; max-width: 380px; text-align: center; box-shadow: 0 20px 60px rgba(0,0,0,0.3); }
    .empty { text-align: center; padding: 60px; color: #9ca3af; }
    .loading { text-align: center; padding: 40px; color: #6b7280; }
  </style>
</head>
<body class="bg-gray-100">
  <div id="root"></div>

  <script type="text/babel">
    const SUPABASE_URL = 'https://zohniclbfhvqmurtrhka.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_wLoQBCmp1MM6f77rFJCbww_H_eJVEUZ';
    const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    const ESTADOS = ['SOLICITADO', 'CARGADA DOCUMENTACION', 'EN PROCESO LIQ.', 'LIQUIDADO', 'BAJA'];
    const BANCOS = ['COLUMBIA', 'SANTANDER', 'GALICIA', 'NACIÓN', 'PROVINCIA', 'SUPERVIELLE', 'OTRO'];
    const PROVINCIAS = ['Buenos Aires','Catamarca','Chaco','Chubut','Córdoba','Corrientes','Entre Ríos','Formosa','La Pampa','La Rioja','Mendoza','Misiones','Neuquén','Río Negro','San Juan','San Luis','Santa Cruz','Santa Fe','Santiago del Estero','Tierra del Fuego'];

    const EMPTY_FORM = {
      fecha_solicitud: '', estado: 'SOLICITADO', banco: '', concesionaria: '', provincia: '', localidad: '',
      dni_cliente: '', nombre_cliente: '', telefono: '', mail: '',
      dominio_vehiculo: '', vehiculo: '',
      fecha_venc_primera_cuota: '', tipo_cuota: 'FIJA', cant_cuotas: '', importe_solicitado: '', gasto_gestoria: '',
      tasa: '3,2', pago_extras: '', comision_operativo: '', comision_gestora_interior: '', retribucion_banco: '',
      documento_01_08: false, titulo_unidad: false, verif_policial: false, informe_dominio: false, constancia_entrega: false,
      fecha_liquidacion: '',
      pagado: false, fecha_pagado: '', pago_com_gest: false, fecha_pago_com_gest: '',
      observaciones: ''
    };

    const parseNum = (v) => parseFloat(String(v).replace(',', '.')) || 0;

    const calcular = (f) => {
      const imp = parseNum(f.importe_solicitado);
      const gest = parseNum(f.gasto_gestoria);
      const extras = parseNum(f.pago_extras);
      const comOp = parseNum(f.comision_operativo);
      const comGest = parseNum(f.comision_gestora_interior);
      const retrib = parseNum(f.retribucion_banco);
      const impCred = imp * 0.012;
      const comLukaya = imp * 0.02;
      const aLiquidar = imp - impCred - comLukaya - gest;
      const ganancia = retrib + comLukaya - comGest - comOp - extras;
      return { impCred, comLukaya, aLiquidar, ganancia };
    };

    const fmt = (v) => {
      if (v === null || v === undefined || v === '') return '-';
      return new Intl.NumberFormat('es-AR', { style: 'currency', currency: 'ARS', maximumFractionDigits: 0 }).format(v);
    };
    const fmtDate = (v) => {
      if (!v) return '-';
      return new Date(v + 'T00:00:00').toLocaleDateString('es-AR');
    };
    const badgeClass = (estado) => {
      if (!estado) return 'badge';
      const e = estado.toLowerCase();
      if (e.includes('liquidado')) return 'badge badge-liquidado';
      if (e.includes('solicitado')) return 'badge badge-solicitado';
      if (e.includes('cargada')) return 'badge badge-cargada';
      if (e.includes('proceso')) return 'badge badge-proceso';
      if (e.includes('baja')) return 'badge badge-baja';
      return 'badge';
    };
    const rowClass = (estado) => {
      if (!estado) return '';
      if (estado === 'LIQUIDADO') return 'liquidado';
      if (estado === 'BAJA') return 'baja';
      return '';
    };
    const Cb = ({ val }) => (
      <span className={`cb ${val ? 'yes' : ''}`}>{val ? '✓' : ''}</span>
    );

    // -------- FORM MODAL --------
    function FormModal({ row, onClose, onSaved }) {
      const [form, setForm] = React.useState(row ? { ...row } : { ...EMPTY_FORM });
      const [saving, setSaving] = React.useState(false);
      const calc = calcular(form);

      const set = (k, v) => setForm(f => ({ ...f, [k]: v }));

      const handleSave = async () => {
        setSaving(true);
        const payload = { ...form };
        // Remove id for insert
        if (!row) delete payload.id;
        payload.importe_solicitado = parseNum(form.importe_solicitado) || null;
        payload.gasto_gestoria = parseNum(form.gasto_gestoria) || null;
        payload.pago_extras = parseNum(form.pago_extras) || null;
        payload.comision_operativo = parseNum(form.comision_operativo) || null;
        payload.comision_gestora_interior = parseNum(form.comision_gestora_interior) || null;
        payload.retribucion_banco = parseNum(form.retribucion_banco) || null;
        payload.cant_cuotas = parseInt(form.cant_cuotas) || null;
        // Clean up empty dates
        ['fecha_solicitud','fecha_venc_primera_cuota','fecha_liquidacion','fecha_pagado','fecha_pago_com_gest'].forEach(k => {
          if (!payload[k]) payload[k] = null;
        });

        let error;
        if (row) {
          ({ error } = await sb.from('lukaya_solicitudes').update(payload).eq('id', row.id));
        } else {
          ({ error } = await sb.from('lukaya_solicitudes').insert(payload));
        }
        setSaving(false);
        if (!error) { onSaved(); onClose(); }
        else alert('Error al guardar: ' + error.message);
      };

      const F = ({ label, name, type = 'text', options, colSpan }) => (
        <div className={`form-group${colSpan === 2 ? ' col-span-2' : ''}`}>
          <label>{label}</label>
          {options ? (
            <select value={form[name] || ''} onChange={e => set(name, e.target.value)}>
              <option value="">-- Seleccionar --</option>
              {options.map(o => <option key={o} value={o}>{o}</option>)}
            </select>
          ) : (
            <input type={type} value={form[name] ?? ''} onChange={e => set(name, type === 'number' ? e.target.value : e.target.value)} />
          )}
        </div>
      );

      const CalcField = ({ label, value }) => (
        <div className="form-group">
          <label>{label}</label>
          <input readOnly value={value !== null && value !== undefined ? new Intl.NumberFormat('es-AR', { style: 'currency', currency: 'ARS', maximumFractionDigits: 0 }).format(value) : '-'} />
        </div>
      );

      const Check = ({ name, label }) => (
        <div className={`check-item ${form[name] ? 'checked' : ''}`} onClick={() => set(name, !form[name])}>
          <input type="checkbox" checked={!!form[name]} onChange={() => {}} />
          <label>{label}</label>
        </div>
      );

      return (
        <div className="modal-overlay" onClick={e => e.target === e.currentTarget && onClose()}>
          <div className="modal-box">
            <div className="modal-header">
              <span style={{ fontSize: 16, fontWeight: 700 }}>{row ? '✏️ Editar Operación' : '➕ Nueva Operación'}</span>
              <button onClick={onClose} style={{ background: 'none', border: 'none', color: 'white', fontSize: 22, cursor: 'pointer', lineHeight: 1 }}>×</button>
            </div>
            <div className="modal-body">

              <div className="section-title">Datos Generales</div>
              <div className="form-grid">
                <F label="Fecha Solicitud" name="fecha_solicitud" type="date" />
                <F label="Estado" name="estado" options={ESTADOS} />
                <F label="Banco" name="banco" options={BANCOS} />
                <F label="Concesionaria" name="concesionaria" />
                <F label="Provincia" name="provincia" options={PROVINCIAS} />
                <F label="Localidad" name="localidad" />
              </div>

              <div className="section-title">Datos del Cliente</div>
              <div className="form-grid">
                <F label="DNI Cliente" name="dni_cliente" />
                <F label="Nombre Cliente" name="nombre_cliente" />
                <F label="Teléfono" name="telefono" />
                <F label="Mail" name="mail" type="email" />
              </div>

              <div className="section-title">Datos del Vehículo</div>
              <div className="form-grid">
                <F label="Dominio" name="dominio_vehiculo" />
                <div className="form-group" style={{ gridColumn: 'span 2' }}>
                  <label>Vehículo</label>
                  <input type="text" value={form.vehiculo || ''} onChange={e => set('vehiculo', e.target.value)} />
                </div>
              </div>

              <div className="section-title">Datos del Crédito</div>
              <div className="form-grid">
                <F label="Fecha Venc. 1° Cuota" name="fecha_venc_primera_cuota" type="date" />
                <F label="Tipo Cuota" name="tipo_cuota" options={['FIJA', 'VARIABLE']} />
                <F label="Cantidad Cuotas" name="cant_cuotas" type="number" />
                <F label="Tasa" name="tasa" />
                <F label="Importe Solicitado" name="importe_solicitado" type="number" />
                <F label="Gasto Gestoría" name="gasto_gestoria" type="number" />
                <CalcField label="1,2% Imp. Crédito (auto)" value={calc.impCred} />
                <CalcField label="Comisión LUKAYA! 2% (auto)" value={calc.comLukaya} />
                <CalcField label="A Liquidar Agencia (auto)" value={calc.aLiquidar} />
              </div>

              <div className="section-title">Documentación</div>
              <div className="check-grid">
                <Check name="documento_01_08" label="Documento 01/08" />
                <Check name="titulo_unidad" label="Título de la Unidad" />
                <Check name="verif_policial" label="Verif. Policial (12)" />
                <Check name="informe_dominio" label="Informe Dominio" />
                <Check name="constancia_entrega" label="Constancia de Entrega" />
              </div>

              <div className="section-title">Liquidación</div>
              <div className="form-grid">
                <F label="Fecha Liquidación" name="fecha_liquidacion" type="date" />
                <F label="Pago Extras" name="pago_extras" type="number" />
                <F label="Comisión Operativo" name="comision_operativo" type="number" />
                <F label="Comisión Gestora Interior" name="comision_gestora_interior" type="number" />
                <F label="Retribución Banco" name="retribucion_banco" type="number" />
                <CalcField label="Ganancia LUKAYA! (auto)" value={calc.ganancia} />
              </div>

              <div className="section-title">Pago</div>
              <div className="form-grid">
                <div className="form-group">
                  <label>Pagado</label>
                  <div className={`check-item ${form.pagado ? 'checked' : ''}`} onClick={() => set('pagado', !form.pagado)} style={{ marginTop: 4 }}>
                    <input type="checkbox" checked={!!form.pagado} onChange={() => {}} />
                    <label>Sí, pagado</label>
                  </div>
                </div>
                {form.pagado && <F label="Fecha Pagado" name="fecha_pagado" type="date" />}
                <div className="form-group">
                  <label>Pago Com. Gestora</label>
                  <div className={`check-item ${form.pago_com_gest ? 'checked' : ''}`} onClick={() => set('pago_com_gest', !form.pago_com_gest)} style={{ marginTop: 4 }}>
                    <input type="checkbox" checked={!!form.pago_com_gest} onChange={() => {}} />
                    <label>Sí, pagado</label>
                  </div>
                </div>
                {form.pago_com_gest && <F label="Fecha Pago Com. Gest." name="fecha_pago_com_gest" type="date" />}
              </div>

              <div className="section-title">Observaciones</div>
              <div className="form-group">
                <textarea rows={3} value={form.observaciones || ''} onChange={e => set('observaciones', e.target.value)} style={{ width: '100%', border: '1px solid #d1d5db', borderRadius: 6, padding: '7px 10px', fontSize: 13, resize: 'vertical', outline: 'none' }} />
              </div>

              <div style={{ display: 'flex', gap: 10, justifyContent: 'flex-end', marginTop: 20, paddingTop: 16, borderTop: '1px solid #e5e7eb' }}>
                <button className="btn btn-secondary" onClick={onClose}>Cancelar</button>
                <button className="btn btn-success" onClick={handleSave} disabled={saving}>
                  {saving ? 'Guardando...' : '💾 Guardar'}
                </button>
              </div>
            </div>
          </div>
        </div>
      );
    }

    // -------- DETAIL MODAL --------
    function DetailModal({ row, onClose, onEdit }) {
      const calc = calcular(row);
      const Section = ({ title }) => <div className="section-title">{title}</div>;
      const Item = ({ label, value, money, date }) => (
        <div style={{ display: 'flex', flexDirection: 'column', marginBottom: 10 }}>
          <span style={{ fontSize: 10, fontWeight: 700, color: '#6b7280', textTransform: 'uppercase', letterSpacing: '0.05em' }}>{label}</span>
          <span style={{ fontSize: 13, color: money ? '#166534' : '#111827', fontWeight: money ? 700 : 400 }}>
            {date ? fmtDate(value) : money ? fmt(value) : (value || '-')}
          </span>
        </div>
      );
      const grid = { display: 'grid', gridTemplateColumns: 'repeat(auto-fill, minmax(160px, 1fr))', gap: '4px 20px' };

      return (
        <div className="modal-overlay" onClick={e => e.target === e.currentTarget && onClose()}>
          <div className="modal-box">
            <div className="modal-header">
              <div>
                <div style={{ fontSize: 16, fontWeight: 700 }}>{row.nombre_cliente || 'Sin nombre'}</div>
                <div style={{ fontSize: 12, opacity: 0.8 }}>{row.vehiculo || ''}</div>
              </div>
              <div style={{ display: 'flex', gap: 8, alignItems: 'center' }}>
                <button className="btn btn-secondary btn-sm" onClick={onEdit}>✏️ Editar</button>
                <button onClick={onClose} style={{ background: 'none', border: 'none', color: 'white', fontSize: 22, cursor: 'pointer', lineHeight: 1 }}>×</button>
              </div>
            </div>
            <div className="modal-body">
              <div style={{ display: 'flex', gap: 8, alignItems: 'center', marginBottom: 12 }}>
                <span className={badgeClass(row.estado)}>{row.estado}</span>
                <span style={{ fontSize: 12, color: '#6b7280' }}>Solicitud: {fmtDate(row.fecha_solicitud)}</span>
                {row.fecha_liquidacion && <span style={{ fontSize: 12, color: '#6b7280' }}>Liquidación: {fmtDate(row.fecha_liquidacion)}</span>}
              </div>

              <Section title="Datos Generales" />
              <div style={grid}>
                <Item label="Banco" value={row.banco} />
                <Item label="Concesionaria" value={row.concesionaria} />
                <Item label="Provincia" value={row.provincia} />
                <Item label="Localidad" value={row.localidad} />
              </div>

              <Section title="Cliente" />
              <div style={grid}>
                <Item label="DNI" value={row.dni_cliente} />
                <Item label="Nombre" value={row.nombre_cliente} />
                <Item label="Teléfono" value={row.telefono} />
                <Item label="Mail" value={row.mail} />
              </div>

              <Section title="Vehículo" />
              <div style={grid}>
                <Item label="Dominio" value={row.dominio_vehiculo} />
                <Item label="Vehículo" value={row.vehiculo} />
              </div>

              <Section title="Crédito" />
              <div style={grid}>
                <Item label="Tipo Cuota" value={row.tipo_cuota} />
                <Item label="Cant. Cuotas" value={row.cant_cuotas} />
                <Item label="Tasa" value={row.tasa ? `${row.tasa}%` : '-'} />
                <Item label="Fecha Venc. 1° Cuota" value={row.fecha_venc_primera_cuota} date />
                <Item label="Importe Solicitado" value={row.importe_solicitado} money />
                <Item label="Gasto Gestoría" value={row.gasto_gestoria} money />
                <Item label="1,2% Imp. Crédito" value={calc.impCred} money />
                <Item label="Comisión LUKAYA! (2%)" value={calc.comLukaya} money />
                <Item label="A Liquidar Agencia" value={calc.aLiquidar} money />
              </div>

              <Section title="Documentación" />
              <div className="check-grid">
                {[
                  ['documento_01_08', 'Documento 01/08'],
                  ['titulo_unidad', 'Título Unidad'],
                  ['verif_policial', 'Verif. Policial'],
                  ['informe_dominio', 'Informe Dominio'],
                  ['constancia_entrega', 'Constancia Entrega'],
                ].map(([k, l]) => (
                  <div key={k} className={`check-item ${row[k] ? 'checked' : ''}`} style={{ cursor: 'default' }}>
                    <Cb val={row[k]} />
                    <label style={{ cursor: 'default' }}>{l}</label>
                  </div>
                ))}
              </div>

              <Section title="Liquidación" />
              <div style={grid}>
                <Item label="Fecha Liquidación" value={row.fecha_liquidacion} date />
                <Item label="Pago Extras" value={row.pago_extras} money />
                <Item label="Com. Operativo" value={row.comision_operativo} money />
                <Item label="Com. Gestora Interior" value={row.comision_gestora_interior} money />
                <Item label="Retribución Banco" value={row.retribucion_banco} money />
                <Item label="Ganancia LUKAYA!" value={calc.ganancia} money />
              </div>

              <Section title="Pago" />
              <div style={grid}>
                <Item label="Pagado" value={row.pagado ? '✅ Sí' : '❌ No'} />
                {row.pagado && <Item label="Fecha Pagado" value={row.fecha_pagado} date />}
                <Item label="Pago Com. Gestora" value={row.pago_com_gest ? '✅ Sí' : '❌ No'} />
                {row.pago_com_gest && <Item label="Fecha Pago Com. Gest." value={row.fecha_pago_com_gest} date />}
              </div>

              {row.observaciones && (
                <>
                  <Section title="Observaciones" />
                  <div style={{ background: '#fef9c3', border: '1px solid #fde047', borderRadius: 6, padding: 10, fontSize: 13 }}>{row.observaciones}</div>
                </>
              )}
            </div>
          </div>
        </div>
      );
    }

    // -------- APP --------
    function App() {
      const [rows, setRows] = React.useState([]);
      const [loading, setLoading] = React.useState(true);
      const [modalNew, setModalNew] = React.useState(false);
      const [modalEdit, setModalEdit] = React.useState(null);
      const [modalDetail, setModalDetail] = React.useState(null);
      const [deleting, setDeleting] = React.useState(null);
      const [filterEstado, setFilterEstado] = React.useState('');
      const [filterBanco, setFilterBanco] = React.useState('');
      const [search, setSearch] = React.useState('');

      const load = async () => {
        setLoading(true);
        const { data } = await sb.from('lukaya_solicitudes').select('*').order('created_at', { ascending: false });
        setRows(data || []);
        setLoading(false);
      };

      React.useEffect(() => { load(); }, []);

      const handleDelete = async (id) => {
        await sb.from('lukaya_solicitudes').delete().eq('id', id);
        setDeleting(null);
        load();
      };

      const filtered = rows.filter(r => {
        if (filterEstado && r.estado !== filterEstado) return false;
        if (filterBanco && r.banco !== filterBanco) return false;
        if (search) {
          const s = search.toLowerCase();
          return (r.nombre_cliente || '').toLowerCase().includes(s)
            || (r.dni_cliente || '').includes(s)
            || (r.vehiculo || '').toLowerCase().includes(s)
            || (r.dominio_vehiculo || '').toLowerCase().includes(s)
            || (r.concesionaria || '').toLowerCase().includes(s);
        }
        return true;
      });

      // Totals
      const totalImporte = filtered.reduce((s, r) => s + (parseNum(r.importe_solicitado) || 0), 0);
      const totalGanancia = filtered.reduce((s, r) => s + calcular(r).ganancia, 0);
      const totalLiquidadas = filtered.filter(r => r.estado === 'LIQUIDADO').length;

      return (
        <div style={{ minHeight: '100vh', display: 'flex', flexDirection: 'column' }}>
          {/* TOPBAR */}
          <div className="topbar">
            <div className="logo">LUKAYA<span>!</span></div>
            <div style={{ fontSize: 13, opacity: 0.7 }}>Sistema de Control de Operaciones</div>
          </div>

          {/* TOOLBAR */}
          <div className="toolbar">
            <button className="btn btn-primary" onClick={() => setModalNew(true)}>➕ Nueva Operación</button>
            <input placeholder="🔍 Buscar cliente, DNI, dominio..." value={search} onChange={e => setSearch(e.target.value)} style={{ minWidth: 240 }} />
            <select value={filterEstado} onChange={e => setFilterEstado(e.target.value)}>
              <option value="">Todos los estados</option>
              {ESTADOS.map(e => <option key={e} value={e}>{e}</option>)}
            </select>
            <select value={filterBanco} onChange={e => setFilterBanco(e.target.value)}>
              <option value="">Todos los bancos</option>
              {BANCOS.map(b => <option key={b} value={b}>{b}</option>)}
            </select>
            <span style={{ marginLeft: 'auto', fontSize: 12, color: '#6b7280' }}>{filtered.length} operación{filtered.length !== 1 ? 'es' : ''}</span>
          </div>

          {/* TOTALS */}
          <div className="totals-bar">
            <div><span>Total operaciones: </span><strong>{filtered.length}</strong></div>
            <div><span>Liquidadas: </span><strong>{totalLiquidadas}</strong></div>
            <div><span>Importe total: </span><strong>{new Intl.NumberFormat('es-AR', { style: 'currency', currency: 'ARS', maximumFractionDigits: 0 }).format(totalImporte)}</strong></div>
            <div><span>Ganancia total LUKAYA!: </span><strong>{new Intl.NumberFormat('es-AR', { style: 'currency', currency: 'ARS', maximumFractionDigits: 0 }).format(totalGanancia)}</strong></div>
          </div>

          {/* TABLE */}
          <div className="table-container" style={{ flex: 1, background: 'white' }}>
            {loading ? (
              <div className="loading">⏳ Cargando operaciones...</div>
            ) : filtered.length === 0 ? (
              <div className="empty">
                <div style={{ fontSize: 40, marginBottom: 8 }}>📋</div>
                <div style={{ fontSize: 15, fontWeight: 600 }}>No hay operaciones</div>
                <div style={{ fontSize: 13, marginTop: 4 }}>Hacé clic en "Nueva Operación" para comenzar</div>
              </div>
            ) : (
              <table>
                <thead>
                  <tr>
                    <th>#</th>
                    <th>F. Solicitud</th>
                    <th>Estado</th>
                    <th>Banco</th>
                    <th>Concesionaria</th>
                    <th>Cliente</th>
                    <th>DNI</th>
                    <th>Vehículo</th>
                    <th>Dom.</th>
                    <th>Cuotas</th>
                    <th>Importe Sol.</th>
                    <th>A Liquidar</th>
                    <th>1,2% Imp.</th>
                    <th>Com. LUKAYA!</th>
                    <th>Com. Gestora</th>
                    <th>Retrib. Banco</th>
                    <th>Ganancia</th>
                    <th style={{ textAlign: 'center' }}>Doc</th>
                    <th style={{ textAlign: 'center' }}>Tít.</th>
                    <th style={{ textAlign: 'center' }}>Ver.</th>
                    <th style={{ textAlign: 'center' }}>Inf.</th>
                    <th style={{ textAlign: 'center' }}>Ent.</th>
                    <th>F. Liquid.</th>
                    <th style={{ textAlign: 'center' }}>Pagado</th>
                    <th>Acciones</th>
                  </tr>
                </thead>
                <tbody>
                  {filtered.map((r, i) => {
                    const c = calcular(r);
                    return (
                      <tr key={r.id} className={rowClass(r.estado)}>
                        <td style={{ color: '#9ca3af', fontSize: 11 }}>{i + 1}</td>
                        <td>{fmtDate(r.fecha_solicitud)}</td>
                        <td><span className={badgeClass(r.estado)}>{r.estado || '-'}</span></td>
                        <td style={{ fontWeight: 600 }}>{r.banco || '-'}</td>
                        <td>{r.concesionaria || '-'}</td>
                        <td style={{ fontWeight: 500 }}>{r.nombre_cliente || '-'}</td>
                        <td style={{ color: '#6b7280' }}>{r.dni_cliente || '-'}</td>
                        <td style={{ maxWidth: 180, overflow: 'hidden', textOverflow: 'ellipsis' }} title={r.vehiculo}>{r.vehiculo || '-'}</td>
                        <td>{r.dominio_vehiculo || '-'}</td>
                        <td style={{ textAlign: 'center' }}>{r.cant_cuotas || '-'}</td>
                        <td className="money">{fmt(r.importe_solicitado)}</td>
                        <td className="money">{fmt(c.aLiquidar)}</td>
                        <td style={{ color: '#6b7280' }}>{fmt(c.impCred)}</td>
                        <td className="money">{fmt(c.comLukaya)}</td>
                        <td style={{ color: '#6b7280' }}>{fmt(r.comision_gestora_interior)}</td>
                        <td style={{ color: '#6b7280' }}>{fmt(r.retribucion_banco)}</td>
                        <td style={{ color: c.ganancia < 0 ? '#dc2626' : '#166534', fontWeight: 700 }}>{fmt(c.ganancia)}</td>
                        <td style={{ textAlign: 'center' }}><Cb val={r.documento_01_08} /></td>
                        <td style={{ textAlign: 'center' }}><Cb val={r.titulo_unidad} /></td>
                        <td style={{ textAlign: 'center' }}><Cb val={r.verif_policial} /></td>
                        <td style={{ textAlign: 'center' }}><Cb val={r.informe_dominio} /></td>
                        <td style={{ textAlign: 'center' }}><Cb val={r.constancia_entrega} /></td>
                        <td>{fmtDate(r.fecha_liquidacion)}</td>
                        <td style={{ textAlign: 'center' }}><Cb val={r.pagado} /></td>
                        <td>
                          <div style={{ display: 'flex', gap: 4 }}>
                            <button className="btn btn-secondary btn-sm" onClick={() => setModalDetail(r)} title="Ver detalle">👁</button>
                            <button className="btn btn-primary btn-sm" onClick={() => setModalEdit(r)} title="Editar">✏️</button>
                            <button className="btn btn-danger btn-sm" onClick={() => setDeleting(r)} title="Eliminar">🗑</button>
                          </div>
                        </td>
                      </tr>
                    );
                  })}
                </tbody>
              </table>
            )}
          </div>

          {/* MODALS */}
          {modalNew && <FormModal onClose={() => setModalNew(false)} onSaved={load} />}
          {modalEdit && <FormModal row={modalEdit} onClose={() => setModalEdit(null)} onSaved={load} />}
          {modalDetail && (
            <DetailModal
              row={modalDetail}
              onClose={() => setModalDetail(null)}
              onEdit={() => { setModalEdit(modalDetail); setModalDetail(null); }}
            />
          )}

          {/* DELETE CONFIRM */}
          {deleting && (
            <div className="delete-confirm">
              <div className="delete-box">
                <div style={{ fontSize: 36, marginBottom: 12 }}>🗑️</div>
                <div style={{ fontSize: 16, fontWeight: 700, marginBottom: 8 }}>¿Eliminar operación?</div>
                <div style={{ fontSize: 13, color: '#6b7280', marginBottom: 20 }}>
                  {deleting.nombre_cliente || 'Sin nombre'} — {deleting.vehiculo || 'Sin vehículo'}
                </div>
                <div style={{ display: 'flex', gap: 10, justifyContent: 'center' }}>
                  <button className="btn btn-secondary" onClick={() => setDeleting(null)}>Cancelar</button>
                  <button className="btn btn-danger" onClick={() => handleDelete(deleting.id)}>Sí, eliminar</button>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
